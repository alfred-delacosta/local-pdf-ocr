[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-ocr"
version = "0.1.0"
description = "Local HTTP API and web UI for PDF and image OCR via LM Studio"
readme = "README.md"
authors = [
  { name = "Advanced Software and AI Solutions LLC" },
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0",
  "pypdfium2>=4.30.0",
  "Pillow>=10.0.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "respx>=0.21.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "data", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
